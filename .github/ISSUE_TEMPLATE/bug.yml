name: Relatar um problema
description: Descreva um comportamento inesperado na Aurora.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: Use dados fictícios. Para relatar uma vulnerabilidade, consulte SECURITY.md.
  - type: textarea
    id: reproduce
    attributes:
      label: Passos para reproduzir
      description: Inclua a URL ou seção afetada, o comportamento observado e o esperado.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente
      description: Informe navegador, largura da tela e, se souber, versão ou commit.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidências
      description: Anexe capturas ou mensagens de erro sem dados pessoais.
